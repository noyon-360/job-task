<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Task Management System - High-Level Architecture</text>

  <!-- Client -->
  <rect x="30" y="200" width="170" height="110" rx="10" fill="#e8f0fe" stroke="#3367d6" stroke-width="2"/>
  <text x="115" y="240" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Client</text>
  <text x="115" y="264" text-anchor="middle" font-size="13" fill="#333">cURL / Browser /</text>
  <text x="115" y="282" text-anchor="middle" font-size="13" fill="#333">Postman</text>

  <!-- Gateway -->
  <rect x="290" y="170" width="220" height="170" rx="10" fill="#fff4e5" stroke="#e8710a" stroke-width="2"/>
  <text x="400" y="205" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">API Gateway</text>
  <text x="400" y="226" text-anchor="middle" font-size="14" fill="#333">Port 3000</text>
  <text x="400" y="256" text-anchor="middle" font-size="13" fill="#333">/users  →  User Service</text>
  <text x="400" y="276" text-anchor="middle" font-size="13" fill="#333">/tasks  →  Task Service</text>
  <text x="400" y="300" text-anchor="middle" font-size="12" fill="#555">Forwards GET, POST, PUT, DELETE</text>
  <text x="400" y="318" text-anchor="middle" font-size="12" fill="#555">404 for unknown routes</text>

  <!-- User service -->
  <rect x="600" y="70" width="190" height="110" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="695" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">User Service</text>
  <text x="695" y="132" text-anchor="middle" font-size="14" fill="#333">Port 3001</text>
  <text x="695" y="156" text-anchor="middle" font-size="12" fill="#555">Manages user profiles</text>

  <!-- Task service -->
  <rect x="600" y="330" width="190" height="110" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="695" y="370" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Task Service</text>
  <text x="695" y="392" text-anchor="middle" font-size="14" fill="#333">Port 3002</text>
  <text x="695" y="416" text-anchor="middle" font-size="12" fill="#555">Manages tasks / to-dos</text>

  <!-- Databases (cylinders) -->
  <g>
    <path d="M840,95 v60 a55,14 0 0 0 110,0 v-60" fill="#f3e8fd" stroke="#8430ce" stroke-width="2"/>
    <ellipse cx="895" cy="95" rx="55" ry="14" fill="#f3e8fd" stroke="#8430ce" stroke-width="2"/>
    <text x="895" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">users.json</text>
    <text x="895" y="194" text-anchor="middle" font-size="12" fill="#555">JSON No-SQL DB</text>
  </g>
  <g>
    <path d="M840,355 v60 a55,14 0 0 0 110,0 v-60" fill="#f3e8fd" stroke="#8430ce" stroke-width="2"/>
    <ellipse cx="895" cy="355" rx="55" ry="14" fill="#f3e8fd" stroke="#8430ce" stroke-width="2"/>
    <text x="895" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">tasks.json</text>
    <text x="895" y="454" text-anchor="middle" font-size="12" fill="#555">JSON No-SQL DB</text>
  </g>

  <!-- Arrows -->
  <line x1="200" y1="245" x2="288" y2="245" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="275" x2="202" y2="275" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="245" y="236" text-anchor="middle" font-size="11" fill="#333">HTTP request</text>
  <text x="245" y="294" text-anchor="middle" font-size="11" fill="#333">JSON response</text>

  <line x1="510" y1="215" x2="598" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="160" font-size="12" fill="#333">/users</text>
  <line x1="510" y1="295" x2="598" y2="370" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="360" font-size="12" fill="#333">/tasks</text>

  <line x1="790" y1="125" x2="838" y2="125" stroke="#333" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="790" y1="385" x2="838" y2="385" stroke="#333" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="814" y="112" text-anchor="middle" font-size="10" fill="#555">fs</text>
  <text x="814" y="372" text-anchor="middle" font-size="10" fill="#555">fs</text>

  <!-- Internal boundary -->
  <rect x="575" y="55" width="395" height="420" rx="14" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="772" y="496" text-anchor="middle" font-size="12" fill="#666">Internal services - only reached through the gateway</text>
</svg>
