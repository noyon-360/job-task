<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#222" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="980" height="640" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#111">UML Sequence Diagram - Client adds a new task (POST /tasks)</text>

  <!-- Lifeline heads -->
  <g font-size="15" font-weight="bold" fill="#111" text-anchor="middle">
    <rect x="50" y="60" width="140" height="50" fill="#e8f0fe" stroke="#3367d6" stroke-width="2"/>
    <text x="120" y="90">:Client</text>
    <rect x="290" y="60" width="160" height="50" fill="#fff4e5" stroke="#e8710a" stroke-width="2"/>
    <text x="370" y="83">:API Gateway</text>
    <text x="370" y="101" font-size="12" font-weight="normal">port 3000</text>
    <rect x="550" y="60" width="160" height="50" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
    <text x="630" y="83">:Task Service</text>
    <text x="630" y="101" font-size="12" font-weight="normal">port 3002</text>
    <rect x="790" y="60" width="150" height="50" fill="#f3e8fd" stroke="#8430ce" stroke-width="2"/>
    <text x="865" y="90">tasks.json</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#888" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="120" y1="110" x2="120" y2="610"/>
    <line x1="370" y1="110" x2="370" y2="610"/>
    <line x1="630" y1="110" x2="630" y2="610"/>
    <line x1="865" y1="110" x2="865" y2="610"/>
  </g>

  <!-- Activation bars -->
  <rect x="113" y="140" width="14" height="440" fill="#d2e3fc" stroke="#3367d6"/>
  <rect x="363" y="160" width="14" height="390" fill="#fde7c8" stroke="#e8710a"/>
  <rect x="623" y="230" width="14" height="270" fill="#ceead6" stroke="#188038"/>
  <rect x="858" y="290" width="14" height="40" fill="#e9d2fd" stroke="#8430ce"/>
  <rect x="858" y="380" width="14" height="40" fill="#e9d2fd" stroke="#8430ce"/>

  <g font-size="13" fill="#111">
    <!-- 1 -->
    <line x1="127" y1="165" x2="361" y2="165" stroke="#222" stroke-width="2" marker-end="url(#solid)"/>
    <text x="244" y="148" text-anchor="middle">1: POST /tasks</text>
    <text x="244" y="160" text-anchor="middle" font-size="11" fill="#444">{ "title": "Deploy to the cloud" }</text>

    <!-- 2 self -->
    <path d="M377,185 h40 v22 h-38" fill="none" stroke="#222" stroke-width="2" marker-end="url(#solid)"/>
    <text x="425" y="200" font-size="12">2: match /tasks → Task Service</text>

    <!-- 3 -->
    <line x1="377" y1="235" x2="621" y2="235" stroke="#222" stroke-width="2" marker-end="url(#solid)"/>
    <text x="500" y="228" text-anchor="middle">3: forward POST /tasks + body</text>

    <!-- 4 -->
    <path d="M637,255 h40 v20 h-38" fill="none" stroke="#222" stroke-width="2" marker-end="url(#solid)"/>
    <text x="685" y="269" font-size="12">4: validate (title required)</text>

    <!-- 5 read -->
    <line x1="637" y1="295" x2="856" y2="295" stroke="#222" stroke-width="2" marker-end="url(#solid)"/>
    <text x="746" y="288" text-anchor="middle">5: fs.readFileSync()</text>
    <line x1="858" y1="325" x2="639" y2="325" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <text x="746" y="318" text-anchor="middle" font-size="12">current tasks [ ]</text>

    <!-- 6 self -->
    <path d="M637,345 h40 v20 h-38" fill="none" stroke="#222" stroke-width="2" marker-end="url(#solid)"/>
    <text x="685" y="359" font-size="12">6: create task (new id, completed: false)</text>

    <!-- 7 write -->
    <line x1="637" y1="385" x2="856" y2="385" stroke="#222" stroke-width="2" marker-end="url(#solid)"/>
    <text x="746" y="378" text-anchor="middle">7: fs.writeFileSync()</text>
    <line x1="858" y1="415" x2="639" y2="415" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <text x="746" y="408" text-anchor="middle" font-size="12">saved</text>

    <!-- 8 response -->
    <line x1="623" y1="470" x2="379" y2="470" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <text x="500" y="462" text-anchor="middle">8: 201 Created + new task JSON</text>

    <!-- 9 response -->
    <line x1="363" y1="530" x2="129" y2="530" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <text x="244" y="522" text-anchor="middle">9: 201 Created</text>
    <text x="244" y="550" text-anchor="middle" font-size="11" fill="#444">{ "id": 3, "title": ..., "completed": false }</text>
  </g>

  <!-- alt note -->
  <rect x="660" y="520" width="290" height="70" fill="#fffbe6" stroke="#b08900"/>
  <text x="672" y="540" font-size="12" fill="#111">Errors:</text>
  <text x="672" y="558" font-size="12" fill="#111">• no title → 400 Bad Request</text>
  <text x="672" y="576" font-size="12" fill="#111">• service down → gateway returns 503</text>

  <text x="40" y="630" font-size="11" fill="#555">Solid arrow = request / call     Dashed arrow = response</text>
</svg>
